on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: tests

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # skip_if_no_stan() in tests/testthat/helper-stan.R calls skip_on_cran(),
      # which skips unless NOT_CRAN is set. Without this, every Stan-backed test
      # in test-stan.R and test-recovery.R -- 37 blocks, the package's entire
      # model-level coverage -- silently skipped here, and CI went green while
      # exercising none of the model. That is how a fixture missing its `rho`
      # column survived unnoticed and left test-stan.R 20/21 broken.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: "https://mc-stan.org/r-packages/"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}

      - name: Install CmdStan
        run: |
          if [ ! -d "$HOME/.cmdstan" ]; then
            Rscript -e "cmdstanr::install_cmdstan(cores = 2)"
          fi
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          # CmdStan's Makefile injects non-portable compiler flags that
          # trigger an R CMD check WARNING we cannot fix upstream.
          error-on: '"error"'
