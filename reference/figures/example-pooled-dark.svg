<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-label="Pooled winner effect: two frequentist back-transforms and metadid"><style>text{font-family:'Lato','Helvetica Neue',Arial,sans-serif}</style>
  <line x1="510.0" y1="34" x2="510.0" y2="202" stroke="#252e47" stroke-width="1.5"/>
  <line x1="720.0" y1="34" x2="720.0" y2="202" stroke="#252e47" stroke-width="1.5"/>
  <line x1="930.0" y1="34" x2="930.0" y2="202" stroke="#252e47" stroke-width="1.5"/>
  <line x1="300" y1="34" x2="300" y2="202" stroke="#e6eaf5" stroke-width="1.6"/>
