  <text x="510.0" y="226" text-anchor="middle" font-size="14" fill="#98a2b8">+5%</text>
  <text x="720.0" y="226" text-anchor="middle" font-size="14" fill="#98a2b8">+10%</text>
  <text x="930.0" y="226" text-anchor="middle" font-size="14" fill="#98a2b8">+15%</text>
