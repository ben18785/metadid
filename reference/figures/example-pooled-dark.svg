  <text x="912.1" y="58" font-size="17" font-weight="900" fill="#E06B6B">+9.9%</text>
  <text x="288" y="105" text-anchor="end" font-size="14" fill="#e6eaf5">g × median baseline CV</text>
  <line x1="512.9" y1="100" x2="849.8" y2="100" stroke="#E06B6B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="681.4" cy="100" r="9" fill="#E06B6B" stroke="#0d1117" stroke-width="2.5"/>
  <text x="863.8" y="106" font-size="17" font-weight="900" fill="#E06B6B">+9.1%</text>
  <text x="288" y="167" text-anchor="end" font-size="14" font-weight="700" fill="#e6eaf5">metadid</text>
  <line x1="355.4" y1="162" x2="546.1" y2="162" stroke="#6487E6" stroke-width="5" stroke-linecap="round"/>
