  <text x="288" y="28" text-anchor="end" font-size="13.5" font-style="italic" fill="#98a2b8">Frequentist, back-transformed:</text>
  <text x="288" y="57" text-anchor="end" font-size="14" fill="#e6eaf5">g × mean baseline CV</text>
  <line x1="531.4" y1="52" x2="898.1" y2="52" stroke="#E06B6B" stroke-width="5" stroke-linecap="round"/>
